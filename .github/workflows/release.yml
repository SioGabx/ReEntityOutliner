name: Publish release

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 📦 Build
      - name: Build with Gradle
        run: ./gradlew build

      # 🧠 Get versions
      - name: Read properties
        run: |
          VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
          MC_VERSION=$(grep "^minecraft_version=" gradle.properties | cut -d'=' -f2)

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "MC_VERSION=$MC_VERSION" >> $GITHUB_ENV
          echo "BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      # 🏷️ Build tag
      - name: Build tag
        run: |
          if [ "$BRANCH" = "main" ]; then
            TAG="v$VERSION"
          else
            TAG="$BRANCH-v$VERSION"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV

      # 📦 Rename artifacts
      - name: Rename artifacts
        run: |
          for loader in fabric forge neoforge; do
            for file in $loader/build/libs/*.jar; do
              if [ -f "$file" ]; then
                # ignore unwanted jars
                if [[ "$file" == *"-sources.jar" || "$file" == *"-dev.jar" ]]; then
                  continue
                fi

                NEW_NAME="reentityoutliner-${loader}-${MC_VERSION}-${VERSION}.jar"
                TARGET="$loader/build/libs/$NEW_NAME"

                # skip if already correct name
                if [ "$file" = "$TARGET" ]; then
                  echo "Skipping (already named): $file"
                  continue
                fi

                echo "Renaming $file → $TARGET"
                mv "$file" "$TARGET"
              fi
            done
          done

      # 🔍 Debug jars
      - name: Debug jars
        run: |
          echo "=== Fabric ==="
          ls -l fabric/build/libs || true
          echo "=== Forge ==="
          ls -l forge/build/libs || true
          echo "=== NeoForge ==="
          ls -l neoforge/build/libs || true

      # 🚀 Create or update release
      - name: Create or update GitHub Release
        run: |
          echo "Using tag: $TAG"

          FILES=$(find fabric forge neoforge -name "*.jar")

          if [ -z "$FILES" ]; then
            echo "❌ No JAR files found!"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists → uploading assets"
            gh release upload "$TAG" $FILES --clobber
          else
            echo "Creating new release"
            gh release create "$TAG" $FILES --title="$TAG"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
